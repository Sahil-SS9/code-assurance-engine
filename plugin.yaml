name: code-assurance-engine
version: 0.1.0
manifest_version: 2
kind: standalone
description: >-
  Change-assurance engine: evaluates an immutable repository candidate against an explicit,
  reviewer-approved check contract and returns machine-readable evidence, findings and unverified
  gaps. Default operation is read-only analysis; execution is a separately approved, isolated
  deployment lane.
author: Sahil Saghir (owner); authored by KENSEI
license: Apache-2.0
homepage: https://github.com/Sahil-SS9/code-assurance-engine
tags:
  - code-assurance
  - evidence
  - review
  - hermes-plugin
requires_env: []
capabilities: []
provides_tools:
  - assure_inspect
  - assure_plan_checks
  - assure_status
  - assure_verify
  - assure_report
  - assure_run
